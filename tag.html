<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tags in HTML</title>
</head>
<body>
    <!-- This is a poem in HTML -->
      <hr>
    <p>Twinkle twinkle little star how I wonder what you are</p>
    <hr/>
    <P>Twinkle twinkle <br>little star <br>how I wonder <br>what you are</P>

    <p>Twinkle twinkle <b>little star</b> <i>how I wonder</i> <u>what you are</u></p>
</body>
</html>
